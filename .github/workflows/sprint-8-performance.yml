
name: Sprint 8 - Performance Testing

on:
  push:
    branches:
      - main
    paths:
      - "sprint-8/**"
      - ".github/workflows/sprint-8-performance.yml"
  pull_request:
    branches:
      - main
    paths:
      - "sprint-8/**"
      - ".github/workflows/sprint-8-performance.yml"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Choose the application performance scenario"
        required: true
        type: choice
        options:
          - healthy
          - slow
        default: healthy

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t sprint-8-app:ci ./sprint-8/app

      - name: Create Docker network
        run: docker network create sprint-8-net

      - name: Start application
        env:
          API_DELAY: ${{ github.event.inputs.test_mode == 'slow' && '1' || '0' }}
        run: |
          echo "Starting application with API_DELAY=${API_DELAY}s"
          docker run -d \
            --name sprint-8-app \
            --network sprint-8-net \
            -p 5000:5000 \
            -e API_DELAY="$API_DELAY" \
            sprint-8-app:ci

      - name: Wait for application readiness
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become healthy"
          docker logs sprint-8-app
          exit 1

      - name: Run k6 performance test
        run: |
          docker run --rm \
            --network sprint-8-net \
            -e BASE_URL=http://sprint-8-app:5000 \
            -v "$PWD/sprint-8/k6:/scripts:ro" \
            grafana/k6 run /scripts/performance.js
